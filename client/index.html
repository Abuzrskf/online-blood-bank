<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank Registration</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 8px; width: 300px; }
        input, select, button { width: 100%; margin: 10px 0; padding: 10px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Donor Registration</h2>
        <form id="bloodForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <select id="bloodGroup">
                <option value="A+">A+</option>
                <option value="O+">O+</option>
                <option value="B+">B+</option>
                <option value="AB+">AB+</option>
            </select>
            <input type="text" id="phone" placeholder="Phone Number" required>
            <input type="text" id="city" placeholder="City" required>
            <button type="submit">Register to Cloud</button>
        </form>
    </div>

    <script>
        document.getElementById('bloodForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value
            };

            const response = await fetch('http://localhost:5000/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            alert(result.message || result.error);
        };
    </script>
</body>
</html>
