<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank Registration</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #f0f2f5; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #d32f2f; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select, button { width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #d32f2f; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 20px; }
        button:hover { background: #b71c1c; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Donor Registration</h2>
        <form id="bloodForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
            
            <label>Blood Group</label>
            <select id="bloodGroup">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="e.g. 9876543210" required>
            
            <label>City</label>
            <input type="text" id="city" placeholder="e.g. Pune" required>
            
            <button type="submit">Register to Cloud</button>
        </form>
    </div>

    <script>
        document.getElementById('bloodForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('name').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value
            };

            try {
                // Pointing to your live Render Backend
                const response = await fetch('https://blood-bank-api-35b9.onrender.com/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    alert("✅ Success: " + result.message);
                    document.getElementById('bloodForm').reset();
                } else {
                    alert("❌ Error: " + (result.error || "Registration failed"));
                }
            } catch (err) {
                alert("❌ Connection Error: Ensure your Render server is live.");
            }
        };
    </script>
</body>
</html>
